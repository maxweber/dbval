name: Build and test

on:
  push:
    branches:
      - '*'
    paths:
      - 'src/**'
      - 'test/**'
      - 'store-slatedb/**'
      - 'project.clj'
      - 'deps.edn'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choose Java 11
        run: |
          echo "JAVA_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_11_X64/bin" >> $GITHUB_PATH
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest
          lein: latest
      - run: ./script/test_clj.sh
      - name: Choose Java 24 for store-slatedb (slatedb-uniffi targets class-file 66 / JDK 22+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - run: clojure -M:test
        working-directory: store-slatedb
